name: Pruebas OCR Notificaciones SAT

on:
  push:
    paths:
      - 'ocr-notificaciones-sat/**'
      - '.github/workflows/pruebas-ocr.yml'
  pull_request:
    paths:
      - 'ocr-notificaciones-sat/**'
      - '.github/workflows/pruebas-ocr.yml'
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-notificaciones-sat
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ocr-notificaciones-sat/requirements-test.txt
      - name: Instalar dependencias de prueba
        run: python -m pip install -r requirements-test.txt
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: El cuaderno coincide con las plantillas
        run: |
          python scripts/build_notebook.py
          git diff --exit-code -- notebooks/
